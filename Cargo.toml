[package]
name = "meshcore-cli-rs"
version = "0.10.1"
edition = "2024"
# rustyline 19 uses cfg_select!, stable since Rust 1.95 (1.94 fails, 1.95
# builds and passes the tests)
rust-version = "1.95"
authors = ["Christian Wohlert <christian667@gmail.com>"]
description = "Command line interface to MeshCore companion radios and repeaters"
license = "MIT"
repository = "https://github.com/chrstnwhlrt/meshcore-cli-rs"
keywords = ["meshcore", "mesh", "networking", "cli", "lora"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "meshcore-cli-rs"
path = "src/main.rs"

[features]
default = ["ble"]
# BLE connections through BlueZ (Linux only, needs libdbus; without effect
# elsewhere)
ble = ["meshcore/ble"]

[dependencies]
# MeshCore protocol library, at the release this CLI is tested with
meshcore = { git = "https://github.com/chrstnwhlrt/meshcore-rs", tag = "v0.10.5", features = ["serde"] }

# Async runtime, child processes for handlers and pipes (their output read
# through a pipe), Ctrl-C, the name lookup for TCP connections
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util", "net"] }

# Line editing, history and completion
rustyline = { version = "19.0.0", default-features = false, features = ["with-dirs"] }

# Display width of a typed password for its masking stars (as rustyline
# measures it)
unicode-width = "0.2.3"

# Payload dicts and json output in the key order of the reference
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

# Local time and the values for strftime patterns (chrono is unmaintained,
# RUSTSEC-2026-0543)
jiff = "1.0.3"

# Logging facade shared with the library
log = "0.4.35"

# Raw serial console of repeaters (-r), and the list of serial ports (-l,
# -S) outside Linux; on Linux that list is read from /dev and sysfs like
# pyserial does, so libudev is left out
serialport = { version = "4.10.1", default-features = false }

# Uploading contact cards to map.meshcore.dev
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

# Terminal width for channel echoes and neighbour lists
terminal_size = "0.4.4"

[target.'cfg(unix)'.dependencies]
# Open flags and error numbers, to report a serial port that cannot be
# opened the way pyserial does
libc = "0.2.191"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
